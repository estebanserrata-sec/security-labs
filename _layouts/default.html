<!doctype html>
<html lang="es">
<head>

  <meta name="description" content="{{ site.description }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow+Condensed:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">

<body>

<header class="top">

      <span class="brand-txt">
        <strong>Esteban Serrata</strong>
        <em>Labs y SOC</em>
      </span>

    <nav class="nav">
      <a href="{{ '/' | relative_url }}">Labs</a>
      <a href="{{ '/soc/wazuh-n8n-thehive/' | relative_url }}">SOC</a>

    </nav>

</header>

<main class="wrap">
  {{ content }}
</main>

<footer class="foot">
  <div class="wrap foot-in">
    <p><strong>Laboratorio propio.</strong> Todo lo publicado se ha ejecutado en entornos de práctica.
    Sin datos de clientes.</p>
    <p class="mono">MIT para el código · CC BY-NC-SA 4.0 para los textos</p>
  </div>
</footer>

</html>
